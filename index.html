        background-color: #f2f2f2; /* Szary kolor dla nagłówka */
    } /* th ma wplyw na rok przebieg cena a td 1932 np*/     /*<div id="samochody"></div> kulminacyjny punkt zaczepienia dla dom, na te chwile jakby pusty kontener przez ktoryu javascript szuka jego id by wiedziiec gdzie wstrzyknac wygenerowana tabele*/ /* <script src="domlab6.js"></script> łacznik z nasza logika, mega wazne by byly one POD div poniewaz przekladarka musi pierw stworzyc miejsce divem zanim skrypt zacznie sie wykonywac*/
